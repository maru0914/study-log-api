name: CI

on: 
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./test.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx oxlint
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:e2e